# Host nginx site for Self Forge. Put in /etc/nginx/sites-available/, link into sites-enabled.
# The upstream ports must match WEB_PORT / API_PORT / MINIO_PORT in deploy/.env.
# Certificates: `certbot certonly --nginx -d selfforge.hexdevop.ru` (see docs/07-deploy.md).

upstream selfforge_web   { server 127.0.0.1:8011; keepalive 16; }
upstream selfforge_api   { server 127.0.0.1:8012; keepalive 16; }
upstream selfforge_minio { server 127.0.0.1:8013; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name selfforge.hexdevop.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than `http2 on;`: the directive only exists since nginx 1.25.1,
    # distro packages ship older versions. Newer nginx accepts this form with a warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name selfforge.hexdevop.ru;

    ssl_certificate     /etc/letsencrypt/live/selfforge.hexdevop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selfforge.hexdevop.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocation is asked for by the app itself ("I'm at this park now"); nothing else.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://selfforge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API rate-limits sign-in per client IP: it has to see the real one.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://selfforge_api;
    }

    # Progress photos. Links are presigned for this host and path, so the path goes through
    # unchanged and Host stays the public name — otherwise MinIO rejects the signature.
    # `^~` without a trailing slash: an upload POSTs to the bare bucket path /progress-photos.
    location ^~ /progress-photos {
        proxy_pass http://selfforge_minio;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        # The upload policy caps a photo at 15 MB; a little headroom for the form fields.
        client_max_body_size 16m;
    }

    location / {
        proxy_pass http://selfforge_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
