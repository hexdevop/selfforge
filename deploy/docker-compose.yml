# Production stack for one VPS behind the host's own nginx (see docs/07-deploy.md).
# Nothing listens on a public interface: the three published ports are bound to 127.0.0.1
# and only the host nginx reaches them. Postgres and Redis aren't published at all.
name: selfforge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # RELEASE.2025-09-07T16-13-09Z, pinned by digest. MinIO no longer publishes community
    # images to Docker Hub; quay.io still serves this build for amd64 and arm64.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
      # backup.sh mirrors the photo bucket here with the mc bundled in the image.
      - ${BACKUP_DIR}/photos:/backups/photos
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ${SELFFORGE_ENV_FILE:-.env}
    environment:
      ENV: production
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: https://${APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN}
    # --proxy-headers: rate limits key on the client's IP, which only nginx knows. Trusting
    # any forwarder is safe here because the port is reachable from the host alone.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
