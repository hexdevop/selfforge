# Movement patterns (docs/01-domain.md). Order of the app is fixed in PatternCode.

- code: squat
  title_ru: Приседание
  description_ru: >-
    Сгибание в коленях и тазу с вертикальным корпусом. Главные мышцы — передняя
    поверхность бедра и ягодицы. Без железа растём через односторонние варианты
    до пистолетика.
- code: hinge
  title_ru: Наклон
  description_ru: >-
    Движение из таза с ровной спиной: таз уходит назад, колени почти не сгибаются.
    Работают ягодицы и задняя поверхность бедра. Сюда же относятся махи гирей.
- code: push_h
  title_ru: Горизонтальный жим
  description_ru: >-
    Жим от груди: отжимания во всех вариантах, жимы лёжа и отжимания на брусьях.
    Грудь, трицепсы, передняя дельта.
- code: push_v
  title_ru: Вертикальный жим
  description_ru: >-
    Жим над головой: жимы стоя и сидя, отжимания «домиком» и в стойке на руках.
    Плечи и трицепсы.
- code: pull_h
  title_ru: Горизонтальная тяга
  description_ru: >-
    Тяга к поясу или груди: тяги в наклоне, горизонтальные тяги на кольцах и петлях.
    Середина спины, задняя дельта, бицепс.
- code: pull_v
  title_ru: Вертикальная тяга
  description_ru: >-
    Тяга сверху вниз: от тяги резинки и австралийских подтягиваний до подтягиваний
    и выхода силой. Широчайшие и бицепс.
- code: lunge
  title_ru: Выпад
  is_bilateral_default: false
  description_ru: >-
    Односторонняя работа ног в шаге: выпады, зашагивания. Кроме силы тренирует
    равновесие и выравнивает разницу между ногами.
- code: carry
  title_ru: Переноска
  description_ru: >-
    Ходьба с грузом. Нагружает хват, корпус и плечевой пояс сразу и хорошо переносится
    на бытовые нагрузки.
- code: core
  title_ru: Кор
  description_ru: >-
    Мышцы корпуса, которые держат позвоночник: планки, раскатки ролика, подъёмы ног,
    антиротация.
- code: cardio
  title_ru: Метаболическая работа
  description_ru: >-
    Работа на выносливость и пульс: скакалка, бёрпи, комплексы с гирей.
