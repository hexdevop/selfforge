name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Matches backend/.env.test (localhost:5433); tests create app_test themselves.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # API types must be regenerated from the backend schema, never edited by hand.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check generated API types are up to date
        env:
          SECRET_KEY: ci-only
        run: |
          (cd ../backend && uv sync --locked && uv run python -c \
            "import json; from app.main import app; print(json.dumps(app.openapi()))") > openapi.json
          pnpm exec openapi-typescript openapi.json --default-non-nullable false -o src/api/schema.d.ts
          git diff --exit-code src/api/schema.d.ts
