server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and manifest must be re-checked every time, or an update never lands.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes: every unknown path is the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
